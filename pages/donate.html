<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Donate | RongKunKmeanMnus</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#fff7f0;--card:#fff;--text:#2a1c10;--muted:#7a6656;--accent:#f27d26;--border:#f1ddcb;--danger:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17110c;--card:#231a13;--text:#f6ebe0;--muted:#b9a592;--border:#3a2b1e}}
:root[data-theme="dark"]{--bg:#17110c;--card:#231a13;--text:#f6ebe0;--muted:#b9a592;--border:#3a2b1e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Khmer",Roboto,sans-serif;display:flex;justify-content:center;padding:20px 14px}
.card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:22px;text-align:center}
h1{margin:0 0 4px;font-size:22px}
.sub{color:var(--muted);font-size:14px;margin:0 0 18px}
.amounts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.amounts button,.custom button{border:1px solid var(--border);background:transparent;color:var(--text);padding:11px 0;border-radius:12px;font-size:15px;cursor:pointer}
.amounts button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.custom{display:flex;gap:8px;margin-bottom:18px}
.custom input{flex:1;min-width:0;padding:11px 12px;border-radius:12px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:15px}
.custom button{padding:11px 16px;background:var(--accent);border-color:var(--accent);color:#fff}
.curbar{display:flex;gap:8px;justify-content:center;margin-bottom:12px}.curbar button{border:1px solid var(--border);background:transparent;color:var(--text);padding:8px 18px;border-radius:999px;cursor:pointer;font-size:14px}.curbar button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.qrbox{background:#fff;border-radius:16px;padding:14px;display:inline-block;border:2px solid var(--accent)}
.qrbox svg{width:230px;height:230px;display:block}
.who{margin:12px 0 2px;font-weight:600}
.amt{font-size:26px;font-weight:700;color:var(--accent)}
.hint{color:var(--muted);font-size:13px;margin-top:6px}
.warn{display:none;background:#fdecea;color:var(--danger);border-radius:10px;padding:10px;font-size:13px;margin-bottom:14px;text-align:left}
a{color:var(--accent)}
</style>
</head>
<body>
<div class="card">
  <h1>☕ Support Us</h1>
  <p class="sub">ជួយគាំទ្រ រោងកុនគ្មានមនុស្ស · Scan with any Bakong-enabled banking app</p>
  <div class="warn" id="warn">Set your <b>BAKONG_ACCOUNT</b> in the script (e.g. <code>yourname@aclb</code>) to enable real payments.</div>
  <div class="curbar"><button id="cUSD">USD $</button><button id="cKHR">Riel ៛</button></div>
  <div class="amounts" id="amounts"></div>
  <div class="custom"><input id="custom" type="number" min="0.1" step="0.1" placeholder="Custom amount (USD)"><button id="go">Set</button></div>
  <div class="qrbox"><div id="qr"></div></div>
  <div class="who">SOK SARUM</div>
  <div class="amt" id="amt">$1.00</div>
  <div class="hint" id="hint1">Open your bank app → Scan → amount is filled in automatically 🙏</div>
  <div class="hint"><a href="https://www.rongkunkmeanmnus.com/">← Back to RongKunKmeanMnus</a></div>
</div>

<script>
// ====== CONFIG: edit these ======
var BAKONG_ACCOUNT = "sarom@aclb";   // your Bakong account ID (public, NOT the API token)
var MERCHANT_NAME  = "SOK SARUM";
var MERCHANT_CITY  = "Phnom Penh";
var PRESETS        = {USD:[0.5,1,2,5,10,20], KHR:[2000,4000,10000,20000,40000,80000]};
var cur = "KHR";   // default currency: "KHR" (Riel) or "USD"
// =================================

function tlv(tag, val){ return tag + String(val.length).padStart(2,"0") + val; }
function crc16(s){
  var c = 0xFFFF;
  for (var i=0;i<s.length;i++){
    c ^= s.charCodeAt(i) << 8;
    for (var j=0;j<8;j++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF;
  }
  return c.toString(16).toUpperCase().padStart(4,"0");
}
function buildKHQR(amount){
  var p = tlv("00","01") + tlv("01", amount>0 ? "12" : "11") +
    tlv("29", tlv("00", BAKONG_ACCOUNT)) +
    tlv("52","5999") + tlv("53", cur==="KHR" ? "116" : "840") +
    (amount>0 ? tlv("54", cur==="KHR" ? String(Math.round(amount)) : Number(amount).toFixed(2)) : "") +
    tlv("58","KH") + tlv("59", MERCHANT_NAME.slice(0,25)) + tlv("60", MERCHANT_CITY.slice(0,15)) +
    (amount>0 ? tlv("99", tlv("00", String(Date.now())) + tlv("01", String(Date.now() + 24*3600*1000))) : "") + "6304";
  return p + crc16(p);
}
var amountNow = 0;
function fmt(a){ return cur==="KHR" ? Math.round(a).toLocaleString("en-US") + " ៛" : "$" + a.toFixed(2); }
function render(amount){
  amount = cur==="KHR" ? Math.round(amount) : Math.round(amount*100)/100;
  if (!(amount >= 0)) return;
  amountNow = amount;
  var qr = qrcode(0, "M");
  qr.addData(buildKHQR(amount));
  qr.make();
  document.getElementById("qr").innerHTML = qr.createSvgTag({cellSize:4, margin:0, scalable:true});
  document.getElementById("amt").textContent = amount > 0 ? fmt(amount) : "Any amount";
  document.getElementById("hint1").textContent = amount > 0 ? "Open your bank app → Scan → amount is filled in automatically 🙏" : "Open your bank app → Scan → type any amount you like 🙏";
  document.querySelectorAll("#amounts button").forEach(function(b){ b.classList.toggle("on", Number(b.dataset.v) === amount); });
}
function buildPresets(){
  var box = document.getElementById("amounts"); box.innerHTML = "";
  var any = document.createElement("button");
  any.textContent = "Any amount (type in my bank app)"; any.dataset.v = 0; any.style.gridColumn = "1 / -1";
  any.onclick = function(){ render(0); };
  box.appendChild(any);
  PRESETS[cur].forEach(function(v){
    var b = document.createElement("button");
    b.textContent = fmt(v); b.dataset.v = v;
    b.onclick = function(){ render(v); };
    box.appendChild(b);
  });
  document.getElementById("custom").placeholder = "Custom amount (" + (cur==="KHR" ? "Riel" : "USD") + ")";
  document.getElementById("cUSD").classList.toggle("on", cur==="USD");
  document.getElementById("cKHR").classList.toggle("on", cur==="KHR");
}
function setCur(c){ cur = c; buildPresets(); render(0); }
document.getElementById("cUSD").onclick = function(){ setCur("USD"); };
document.getElementById("cKHR").onclick = function(){ setCur("KHR"); };
document.getElementById("go").onclick = function(){ render(parseFloat(document.getElementById("custom").value)); };
if (BAKONG_ACCOUNT.indexOf("YOUR_ID") === 0) document.getElementById("warn").style.display = "block";
setCur(cur);
</script>
</body>
</html>
