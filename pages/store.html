<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store | RongKunKmeanMnus</title>
  <meta name="description" content="Shop products featured on RongKunKmeanMnus.">
  <style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--brand:#f27d26;--bg:#0a0a0a;--bg2:#111;--bg3:#181818;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);--text:#e4e4e7;--text2:#71717a;}
html{scroll-behavior:smooth}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
a{text-decoration:none;color:inherit}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:9999px}

/* Navbar */
#navbar{position:fixed;top:0;left:0;right:0;z-index:200}
#nav-inner{display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 32px;background:rgba(8,8,8,.97);border-bottom:1px solid var(--border)}
.nav-logo{display:flex;align-items:center;gap:9px}
.nav-logo-icon{width:30px;height:30px;background:var(--brand);border-radius:50%;display:flex;align-items:center;justify-content:center}
.nav-logo-icon svg{fill:#fff;width:12px;height:12px;transform:translateX(1px)}
.nav-logo-text{font-size:1.1rem;font-weight:800;color:#fff;letter-spacing:-.02em}
.nav-back{display:flex;align-items:center;gap:7px;font-size:.8rem;font-weight:700;color:#777;padding:7px 14px;border:1px solid var(--border2);border-radius:9999px;transition:all .2s}
.nav-back:hover{color:#fff;border-color:#555}
.nav-back svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.5}

/* Page */
.page-wrap{max-width:1280px;margin:0 auto;padding:80px 24px 60px}
@media(max-width:640px){.page-wrap{padding:72px 14px 60px}}

/* Header */
.store-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:32px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.store-title-wrap{display:flex;align-items:center;gap:14px}
.store-icon{width:48px;height:48px;background:rgba(242,125,38,.1);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0}
.store-title{font-size:1.8rem;font-weight:900;color:#fff;letter-spacing:-.03em}
.store-subtitle{font-size:.82rem;color:var(--text2);margin-top:2px}
.store-count{font-size:.75rem;font-weight:700;color:var(--text2);background:var(--bg3);border:1px solid var(--border2);padding:5px 14px;border-radius:9999px}

/* Filter bar */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.filter-btn{padding:6px 16px;background:var(--bg3);border:1px solid var(--border2);border-radius:9999px;font-size:.78rem;font-weight:700;color:#777;cursor:pointer;transition:all .2s;font-family:inherit}
.filter-btn.active,.filter-btn:hover{background:rgba(242,125,38,.1);border-color:rgba(242,125,38,.3);color:#f27d26}

/* Product grid */
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
@media(max-width:640px){.product-grid{grid-template-columns:repeat(2,1fr);gap:12px}}

/* Product card */
.product-card{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;overflow:hidden;transition:all .25s;cursor:pointer;display:flex;flex-direction:column}
.product-card:hover{border-color:rgba(242,125,38,.35);transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,0,0,.5)}
.product-thumb{position:relative;aspect-ratio:1/1;overflow:hidden;background:var(--bg3)}
.product-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.product-card:hover .product-thumb img{transform:scale(1.04)}
.product-badge{position:absolute;top:10px;left:10px;background:#f27d26;color:#000;font-size:.62rem;font-weight:900;padding:3px 9px;border-radius:6px;text-transform:uppercase;letter-spacing:.05em}
.product-badge.sold-out{background:#444;color:#888}
.product-info{padding:14px;flex:1;display:flex;flex-direction:column}
.product-name{font-size:.9rem;font-weight:700;color:#e4e4e7;line-height:1.4;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.product-desc{font-size:.75rem;color:#555;line-height:1.5;margin-bottom:10px;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.product-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.product-price{font-size:1rem;font-weight:800;color:#f27d26}
.product-price small{font-size:.7rem;color:#555;font-weight:500}
.buy-btn{padding:7px 16px;background:#f27d26;color:#000;font-size:.75rem;font-weight:800;border-radius:9999px;border:none;cursor:pointer;transition:all .2s;font-family:inherit;white-space:nowrap}
.buy-btn:hover{background:#ff9340;transform:scale(1.04)}
.buy-btn.sold-out{background:#2a2a2a;color:#555;cursor:not-allowed;transform:none}

/* Commission badge */
.commission-badge{display:inline-flex;align-items:center;gap:4px;font-size:.65rem;font-weight:700;color:#22c55e;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.15);padding:2px 8px;border-radius:9999px;margin-top:6px;width:fit-content}

/* Empty state */
.empty-store{text-align:center;padding:80px 24px;color:var(--text2)}
.empty-store-icon{font-size:3rem;margin-bottom:16px}
.empty-store h3{font-size:1.1rem;font-weight:700;color:#fff;margin-bottom:8px}

/* Loading skeleton */
.skel-product{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;overflow:hidden}
.skel-product-img{aspect-ratio:1/1;background:var(--bg3);animation:shimmer 1.5s infinite}
.skel-product-body{padding:14px}
.skel-line{height:12px;background:var(--bg3);border-radius:4px;margin-bottom:8px;animation:shimmer 1.5s infinite}
@keyframes shimmer{0%,100%{opacity:.5}50%{opacity:1}}

/* Footer */
.page-footer{border-top:1px solid var(--border);padding:32px 24px;text-align:center;margin-top:60px}
.pf-links{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;margin-top:12px}
.pf-links a{font-size:.7rem;font-weight:700;color:#333;text-transform:uppercase;letter-spacing:.08em;transition:color .2s}
.pf-links a:hover{color:var(--brand)}
.pf-copy{font-size:.72rem;color:#222;margin-top:8px}
  </style>
</head>
<body>

<div id="navbar">
  <div id="nav-inner">
    <a href="/" class="nav-logo">
      <div class="nav-logo-icon"><svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg></div>
      <span class="nav-logo-text">RongKunKmeanMnus</span>
    </a>
    <a href="/" class="nav-back">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      Back to Home
    </a>
  </div>
</div>

<div class="page-wrap">
  <!-- Header -->
  <div class="store-header">
    <div class="store-title-wrap">
      <div class="store-icon">🛍️</div>
      <div>
        <h1 class="store-title">Store</h1>
        <p class="store-subtitle">Curated products from our partners</p>
      </div>
    </div>
    <span class="store-count" id="store-count">Loading...</span>
  </div>

  <!-- Filter bar -->
  <div class="filter-bar" id="filter-bar">
    <button class="filter-btn active" onclick="filterProducts('all',this)">All</button>
  </div>

  <!-- Product grid -->
  <div class="product-grid" id="product-grid">
    <!-- Loading skeletons -->
    ${Array(8).fill(`
    <div class="skel-product">
      <div class="skel-product-img"></div>
      <div class="skel-product-body">
        <div class="skel-line" style="width:80%"></div>
        <div class="skel-line" style="width:60%"></div>
        <div class="skel-line" style="width:40%"></div>
      </div>
    </div>`).join('')}
  </div>
</div>

<div class="page-footer">
  <div style="display:inline-flex;align-items:center;gap:9px;margin-bottom:10px">
    <div class="nav-logo-icon"><svg viewBox="0 0 24 24" fill="#fff" width="13" height="13" style="transform:translateX(1px)"><polygon points="5,3 19,12 5,21"/></svg></div>
    <span style="font-size:1rem;font-weight:800;color:#fff">RongKunKmeanMnus</span>
  </div>
  <div class="pf-links">
    <a href="/">Home</a>
    <a href="/about">About</a>
    <a href="/privacy">Privacy</a>
    <a href="/terms">Terms</a>
    <a href="/contact">Contact</a>
  </div>
  <p class="pf-copy">&copy; 2026 RongKunKmeanMnus. All rights reserved.</p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc, increment, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAnXxuc92620WOz_bVkovnUEQ_LL4YFPp8",
  authDomain: "streamhub-ce717.firebaseapp.com",
  projectId: "streamhub-ce717",
  storageBucket: "streamhub-ce717.firebasestorage.app",
  messagingSenderId: "223272731262",
  appId: "1:223272731242:web:d17866d4a12f610c864e2f"
};
const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

let allProducts = [];
let currentFilter = 'all';

// Load products
async function loadProducts(){
  try {
    const snap = await getDocs(query(collection(db,'products'), where('is_active','==',true), orderBy('createdAt','desc')));
    allProducts = snap.docs.map(d=>({id:d.id,...d.data()}));
    renderStore();
  } catch(e){
    console.error(e);
    document.getElementById('product-grid').innerHTML = `<div class="empty-store" style="grid-column:1/-1"><div class="empty-store-icon">⚠️</div><h3>Could not load products</h3><p>${e.message}</p></div>`;
  }
}

// Build filter tags from categories
function buildFilters(){
  const cats = [...new Set(allProducts.map(p=>p.category).filter(Boolean))];
  const bar = document.getElementById('filter-bar');
  bar.innerHTML = `<button class="filter-btn active" onclick="window.filterProducts('all',this)">All</button>`
    + cats.map(c=>`<button class="filter-btn" onclick="window.filterProducts('${c}',this)">${c}</button>`).join('');
}

function renderStore(){
  buildFilters();
  window.filterProducts(currentFilter);
}

window.filterProducts = (cat, btn) => {
  currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');

  const list = cat === 'all' ? allProducts : allProducts.filter(p=>p.category===cat);
  const grid = document.getElementById('product-grid');
  const count = document.getElementById('store-count');
  count.textContent = `${list.length} product${list.length!==1?'s':''}`;

  if(!list.length){
    grid.innerHTML = `<div class="empty-store" style="grid-column:1/-1">
      <div class="empty-store-icon">🛍️</div>
      <h3>No products yet</h3>
      <p>Check back soon!</p>
    </div>`;
    return;
  }

  grid.innerHTML = list.map(p=>`
    <div class="product-card" onclick="window.buyProduct('${p.id}','${escHtml(p.link||'')}')">
      <div class="product-thumb">
        <img src="${escHtml(p.image||'')}" alt="${escHtml(p.name||'')}" onerror="this.src='https://picsum.photos/seed/${p.id}/400/400'">
        ${p.is_sold_out ? '<div class="product-badge sold-out">Sold Out</div>' : (p.badge ? `<div class="product-badge">${escHtml(p.badge)}</div>` : '')}
      </div>
      <div class="product-info">
        <div class="product-name">${escHtml(p.name||'')}</div>
        ${p.description ? `<div class="product-desc">${escHtml(p.description)}</div>` : ''}
        <div class="product-footer">
          <div>
            <div class="product-price">$${escHtml(String(p.price||'0'))} <small>${escHtml(p.currency||'USD')}</small></div>
            ${p.commission ? `<div class="commission-badge">✦ ${p.commission}% commission</div>` : ''}
          </div>
          <button class="buy-btn ${p.is_sold_out?'sold-out':''}" onclick="event.stopPropagation();window.buyProduct('${p.id}','${escHtml(p.link||'')}')">
            ${p.is_sold_out ? 'Sold Out' : 'Buy Now →'}
          </button>
        </div>
      </div>
    </div>`).join('');
};

window.buyProduct = async (id, link) => {
  if(!link) return;
  // Track click
  try { await updateDoc(doc(db,'products',id), {clicks: increment(1)}); } catch(e){}
  // Open seller link
  window.open(link, '_blank', 'noopener');
};

function escHtml(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

loadProducts();
</script>
</body>
</html>
